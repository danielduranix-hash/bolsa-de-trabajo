<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración - Bolsa de Trabajo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Barra Superior de Navegación -->
  <header class="navbar navbar-dark sticky-top bg-dark flex-md-nowrap p-2 shadow">
    <a class="navbar-brand col-md-3 col-lg-2 me-0 px-3 fs-6 text-white" href="#">Bolsa de Trabajo Admin</a>
    <div class="navbar-nav ms-auto">
      <div class="nav-item text-nowrap me-3">
        <button id="btn-cerrar-sesion" class="btn btn-outline-light btn-sm">Cerrar Sesión</button>
      </div>
    </div>
  </header>

  <div class="container-fluid">
    <div class="row">
      <!-- Barra Lateral (Sidebar) -->
      <nav id="sidebarMenu" class="col-md-3 col-lg-2 d-md-block bg-light sidebar border-end vh-100">
        <div class="position-sticky pt-3">
          <ul class="nav flex-column">
            <li class="nav-item">
              <a class="nav-link active fw-bold text-dark" href="#" onclick="cambiarSeccionAdmin('empresas')">
                <i class="bi bi-building me-2"></i>Empresas
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-dark" href="#" onclick="cambiarSeccionAdmin('vacantes')">
                <i class="bi bi-briefcase me-2"></i>Vacantes
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-dark" href="#" onclick="cambiarSeccionAdmin('ciudadania')">
                <i class="bi bi-people me-2"></i>Ciudadanía
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-dark" href="#" onclick="cambiarSeccionAdmin('postulaciones')">
                <i class="bi bi-file-earmark-text me-2"></i>Postulaciones
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-dark" href="#" onclick="cambiarSeccionAdmin('catalogos')">
                <i class="bi bi-folder me-2"></i>Catálogos
              </a>
            </li>
          </ul>
        </div>
      </nav>

      <!-- Área Principal de Contenido -->
      <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
        <div id="admin-contenido">
          <h2>Módulo de Vacantes</h2>
          <p>Selecciona una opción de la barra lateral.</p>
        </div>
      </main>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
