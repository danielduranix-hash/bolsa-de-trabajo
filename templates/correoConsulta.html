<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { 
      font-family: Arial, sans-serif; 
      color: #333; 
      line-height: 1.6; 
      margin: 0; 
      padding: 0; 
      background-color: #f8fafc;
    }
    .container { 
      max-width: 600px; 
      margin: 0 auto; 
      padding: 20px; 
    }
    .header { 
      background: linear-gradient(135deg, #0d3c75, #1e3a8a); 
      color: white; 
      padding: 25px; 
      border-radius: 8px 8px 0 0; 
      text-align: center;
    }
    .header h1 { 
      margin: 0; 
      font-size: 22px; 
    }
    .header p { 
      margin: 5px 0 0 0; 
      opacity: 0.9; 
      font-size: 14px; 
    }
    
    /* ⬇️ ZONA DE LA IMAGEN */
    .logo-container {
      text-align: center;
      padding: 20px 0;
      background: white;
    }
    .logo-container img {
      max-width: 200px;
      height: auto;
    }
    
    .content { 
      background: #f8fafc; 
      padding: 25px; 
      border-radius: 0 0 8px 8px; 
    }
    .campo { 
      margin-bottom: 18px; 
    }
    .etiqueta { 
      font-weight: bold; 
      color: #0d3c75; 
      font-size: 11px; 
      text-transform: uppercase; 
      letter-spacing: 0.5px; 
      margin-bottom: 5px; 
    }
    .valor { 
      background: white; 
      padding: 12px 16px; 
      border-radius: 6px; 
      border: 1px solid #e2e8f0; 
      font-size: 14px; 
    }
    .comentarios { 
      background: white; 
      padding: 16px; 
      border-radius: 6px; 
      border-left: 4px solid #10b981; 
      white-space: pre-wrap; 
      font-size: 14px; 
    }
    .footer { 
      text-align: center; 
      color: #94a3b8; 
      font-size: 11px; 
      margin-top: 25px; 
      padding-top: 15px; 
      border-top: 1px solid #e2e8f0; 
    }
    a { 
      color: #0d3c75; 
      text-decoration: none; 
    }
    a:hover { 
      text-decoration: underline; 
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📩 Nueva consulta ciudadana</h1>
      <p>Consulta #{{idConsulta}}</p>
    </div>
    
    <!-- ⬇️ IMAGEN DEBAJO DEL HEADER -->
    <div class="logo-container">
      <img 
        src="cid:logoConsulta" 
        alt="Dirección de Prosperidad y Bienestar Económico"
      />
    </div>
    
    <div class="content">
      <div class="campo">
        <div class="etiqueta">Nombre completo</div>
        <div class="valor">{{nombre_completo}}</div>
      </div>
      <div class="campo">
        <div class="etiqueta">Correo electrónico</div>
        <div class="valor">
          <a href="mailto:{{correo}}">{{correo}}</a>
        </div>
      </div>
      <div class="campo">
        <div class="etiqueta">Teléfono</div>
        <div class="valor">{{telefono}}</div>
      </div>
      <div class="campo">
        <div class="etiqueta">Comentarios</div>
        <div class="comentarios">{{comentarios}}</div>
      </div>
      <div class="footer">
        Recibido el {{fechaEnvio}}<br>
        Dirección de Prosperidad y Bienestar Económico
      </div>
    </div>
  </div>
</body>
</html>
