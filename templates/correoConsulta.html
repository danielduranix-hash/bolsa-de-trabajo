<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { 
      font-family: Arial, sans-serif; 
      color: #333; 
      line-height: 1.6; 
      margin: 0; 
      padding: 0; 
      background-color: #f8fafc;
    }
    .container { 
      max-width: 600px; 
      margin: 0 auto; 
      padding: 20px; 
      background: #ffffff;            /* fondo blanco */
      border: 4px dashed #10b981;     /* borde verde con rayas */
      border-radius: 8px;               /* esquinas redondeadas */
    }
    .header { 
      background: linear-gradient(135deg, #0d3c75, #1e3a8a); 
      color: white; 
      padding: 25px; 
      border-radius: 8px 8px 0 0; 
      text-align: center;
    }
    .header h1 { 
      margin: 0; 
      font-size: 22px; 
    }
    .header p { 
      margin: 5px 0 0 0; 
      opacity: 0.9; 
      font-size: 14px; 
    }
    
    /* ⬇️ ZONA DE LA IMAGEN */
    .logo-container {
      text-align: center;
      padding: 20px 0;
      background: white;
    }
    .logo-container img {
      max-width: 200px;
      height: auto;
    }
    
    .content { 
        background: #f8fafc; 
        padding: 25px; 
        border-radius: 8px; 
    }
    /* Diseño de tabla y consulta basado en code.html */
    /* Tarjeta de Datos del Remitente */
    .data-table {
      width: 100%;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 18px;
    }
    .data-row {
      border-bottom: 1px solid #f1f5f9;
    }
    .data-row:last-child {
      border-bottom: none;
    }
    .data-cell-label {
      width: 32%;
      padding: 11px 14px;
      background-color: #f8fafc;
      font-size: 11px;
      font-weight: 700;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      border-right: 1px solid #e2e8f0;
    }
    .data-cell-value {
      padding: 11px 16px;
      font-size: 14px;
      color: #0f172a;
      font-weight: 500;
    }
    .data-cell-value a {
      color: #0d3c75;
      font-weight: 600;
      text-decoration: none;
    }
    .data-cell-value a:hover {
      text-decoration: underline;
    }

    /* Caja de la Consulta / Mensaje */
    .query-box {
      background-color: #f8fafc;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      border-left: 5px solid #10b981;
      padding: 18px;
      margin-bottom: 22px;
    }
    .query-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 12px;
      color: #475569;
      font-weight: 600;
    }
    .badge-origin {
      display: inline-block;
      background: #e0e7ff;
      color: #1e3a8a;
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: 700;
    }
    .query-text {
      font-size: 14px;
      line-height: 1.65;
      color: #1e293b;
      white-space: pre-wrap;
      margin: 0;
    }


    .footer { 
      text-align: center; 
      color: #94a3b8; 
      font-size: 11px; 
      margin-top: 25px; 
      padding-top: 15px; 
      border-top: 1px solid #e2e8f0; 
    }
    a { 
      color: #0d3c75; 
      text-decoration: none; 
    }
    a:hover { 
      text-decoration: underline; 
    }
  </style>
</head>
<body>
  <div class="container">
    <!--
    <div class="header">
      <h1>📩 Nueva consulta ciudadana</h1>
      <p>Consulta #{{idConsulta}}</p>
    </div>
    -->

    <!-- ⬇️ IMAGEN DEBAJO DEL HEADER -->
    <div class="logo-container">
      <img 
        src="cid:logoConsulta" 
        alt="Dirección de Prosperidad y Bienestar Económico"
      />
    </div>
    
    <div class="content">
      <div class="section-title">Datos del Solicitante / Ciudadano</div>

      <table class="data-table">
        <tbody>
          <tr class="data-row">
            <td class="data-cell-label">Nombre</td>
            <td class="data-cell-value"><strong>{{nombre_completo}}</strong></td>
          </tr>
          <tr class="data-row">
            <td class="data-cell-label">Correo electrónico</td>
            <td class="data-cell-value">
              <a href="mailto:{{correo}}?subject=Respuesta a consulta {{idConsulta}} - Dirección de Prosperidad" class=""> {{correo}}</a>
            </td>
          </tr>
          <tr class="data-row">
            <td class="data-cell-label">Teléfono</td>
            <td class="data-cell-value">
              <a href="tel:{{telefono}}" style="color: #334155; text-decoration: none;" class="">{{telefono}}</a>
            </td>
          </tr>
        </tbody>
      </table>

      <div class="section-title">¿Qué dudas tienes?</div>

      <div class="query-box">
        <div class="query-header">
          <span>Mensaje recibido del ciudadano:</span>
        </div>
        <div class="query-text">{{comentarios}}</div>
      </div>

      <div class="footer">
        Recibido el {{fechaEnvio}}<br>
        Dirección de Prosperidad y Bienestar Económico
      </div>
    </div>
  </div>
</body>
</html>
